version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: asl-bridge-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: asl_bridge_ai
    volumes:
      - mongo-data:/data/db

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: asl-bridge-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AI_PORT=8000
      - AI_HOST=0.0.0.0
      - AI_ENV=production
    volumes:
      - ./ai-service:/app
    depends_on:
      - mongodb

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asl-bridge-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/asl_bridge_ai
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=production_asl_secret_jwt_key_2026
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asl-bridge-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo-data:
